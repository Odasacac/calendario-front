<div class="pagina-centrada">
  <section class="card tarjeta-auth">
    <header>
      <span class="emblema" aria-hidden="true">
        <app-icono nombre="estrella" [tamanyo]="26" />
      </span>
      <h1>{{ t('app.lema') }}</h1>
      <p>{{ t('login.titulo') }}</p>
    </header>

    <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
      <div class="field">
        <label for="user">{{ t('login.usuario') }}</label>
        <input
          id="user"
          class="input"
          type="text"
          autocomplete="username"
          formControlName="user"
          [class.invalid]="invalido('user')"
          [attr.aria-invalid]="invalido('user')"
          [attr.aria-describedby]="invalido('user') ? 'user-error' : null"
          [placeholder]="t('login.usuarioPlaceholder')"
        />
        @if (invalido('user')) {
          <p class="field-error" id="user-error">
            <app-icono nombre="alerta" [tamanyo]="14" />
            {{ t('comun.obligatorio') }}
          </p>
        }
      </div>

      <div class="field">
        <label for="password">{{ t('login.contrasenya') }}</label>
        <div class="input-group">
          <input
            id="password"
            class="input"
            [type]="verContrasenya() ? 'text' : 'password'"
            autocomplete="current-password"
            formControlName="password"
            [class.invalid]="invalido('password')"
            [attr.aria-invalid]="invalido('password')"
            [attr.aria-describedby]="invalido('password') ? 'password-error' : null"
            [placeholder]="t('login.contrasenyaPlaceholder')"
          />
          <button
            type="button"
            class="input-action"
            [attr.aria-label]="
              verContrasenya() ? t('login.ocultarContrasenya') : t('login.mostrarContrasenya')
            "
            [attr.aria-pressed]="verContrasenya()"
            (click)="verContrasenya.set(!verContrasenya())"
          >
            <app-icono [nombre]="verContrasenya() ? 'ojo-cerrado' : 'ojo'" [tamanyo]="18" />
          </button>
        </div>
        @if (invalido('password')) {
          <p class="field-error" id="password-error">
            <app-icono nombre="alerta" [tamanyo]="14" />
            {{ t('comun.obligatorio') }}
          </p>
        }
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        <app-icono nombre="candado" [tamanyo]="18" />
        {{ t('login.entrar') }}
      </button>
    </form>

    <hr class="divider" />

    <button type="button" class="btn btn-accent btn-block" (click)="entrarComoInvitado()">
      <app-icono nombre="usuario" [tamanyo]="18" />
      {{ t('login.entrarComoInvitado') }}
    </button>

    <div class="pie-tarjeta">
      <button type="button" class="btn-link" (click)="irA('/recovery')">
        {{ t('login.olvidada') }}
      </button>
      <button type="button" class="btn-link" (click)="irA('/register')">
        {{ t('login.crearCuenta') }} →
      </button>
    </div>
  </section>
</div>
