<div class="pagina-centrada">
  <section class="card tarjeta-auth">
    <header>
      <span class="emblema" aria-hidden="true">
        <app-icono nombre="usuario" [tamanyo]="24" />
      </span>
      <h1>{{ t('registro.titulo') }}</h1>
      <p>{{ t('registro.subtitulo') }}</p>
    </header>

    <form [formGroup]="formulario" (ngSubmit)="crearCuenta()" novalidate>
      <div class="dos-columnas">
        <div class="field">
          <label for="nombre">{{ t('registro.nombre') }}</label>
          <input
            id="nombre"
            class="input"
            type="text"
            autocomplete="given-name"
            formControlName="nombre"
            [class.invalid]="invalido('nombre')"
            [attr.aria-invalid]="invalido('nombre')"
          />
          @if (invalido('nombre')) {
            <p class="field-error">
              <app-icono nombre="alerta" [tamanyo]="14" />
              {{ error('nombre') }}
            </p>
          }
        </div>

        <div class="field">
          <label for="apellido">{{ t('registro.apellido') }}</label>
          <input
            id="apellido"
            class="input"
            type="text"
            autocomplete="family-name"
            formControlName="apellido"
            [class.invalid]="invalido('apellido')"
            [attr.aria-invalid]="invalido('apellido')"
          />
          @if (invalido('apellido')) {
            <p class="field-error">
              <app-icono nombre="alerta" [tamanyo]="14" />
              {{ error('apellido') }}
            </p>
          }
        </div>
      </div>

      <div class="field">
        <label for="correo">{{ t('registro.email') }}</label>
        <input
          id="correo"
          class="input"
          type="email"
          inputmode="email"
          autocomplete="email"
          formControlName="correo"
          [class.invalid]="invalido('correo')"
          [attr.aria-invalid]="invalido('correo')"
        />
        @if (invalido('correo')) {
          <p class="field-error">
            <app-icono nombre="alerta" [tamanyo]="14" />
            {{ error('correo') }}
          </p>
        }
      </div>

      <div class="field">
        <label for="fecha">{{ t('registro.fechaNacimiento') }}</label>
        <input
          id="fecha"
          class="input"
          type="date"
          autocomplete="bday"
          formControlName="fecha"
          [class.invalid]="invalido('fecha')"
          [attr.aria-invalid]="invalido('fecha')"
        />
        @if (invalido('fecha')) {
          <p class="field-error">
            <app-icono nombre="alerta" [tamanyo]="14" />
            {{ error('fecha') }}
          </p>
        }
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        {{ t('registro.crear') }}
      </button>
      <button type="button" class="btn btn-ghost btn-block" (click)="volverAlLogin()">
        <app-icono nombre="izquierda" [tamanyo]="16" />
        {{ t('comun.volverAlLogin') }}
      </button>
    </form>
  </section>
</div>
