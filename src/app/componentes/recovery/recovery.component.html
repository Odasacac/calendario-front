<div class="pagina-centrada">
  <section class="card tarjeta-auth">
    <header>
      <span class="emblema" aria-hidden="true">
        <app-icono nombre="candado" [tamanyo]="24" />
      </span>
      <h1>{{ t('recuperar.titulo') }}</h1>
      <p>{{ t('recuperar.subtitulo') }}</p>
    </header>

    <form [formGroup]="formulario" (ngSubmit)="recuperar()" novalidate>
      <div class="field">
        <label for="correo">{{ t('recuperar.email') }}</label>
        <input
          id="correo"
          class="input"
          type="email"
          inputmode="email"
          autocomplete="email"
          formControlName="correo"
          [class.invalid]="invalido"
          [attr.aria-invalid]="invalido"
          [attr.aria-describedby]="invalido ? 'correo-error' : null"
        />
        @if (invalido) {
          <p class="field-error" id="correo-error">
            <app-icono nombre="alerta" [tamanyo]="14" />
            {{ error }}
          </p>
        }
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        {{ t('recuperar.enviar') }}
      </button>
      <button type="button" class="btn btn-ghost btn-block" (click)="volverAlLogin()">
        <app-icono nombre="izquierda" [tamanyo]="16" />
        {{ t('comun.volverAlLogin') }}
      </button>
    </form>
  </section>
</div>
