<div class="home">
  <div class="barra no-print">
    <div class="estado">
      @if (esHoy()) {
        <span class="chip chip-primary">
          <app-icono nombre="sol" [tamanyo]="14" />
          {{ t('home.hoy') }}
        </span>
      } @else {
        <button type="button" class="btn btn-outline" (click)="volverAHoy()">
          <app-icono nombre="sol" [tamanyo]="18" />
          {{ t('home.volverAHoy') }}
        </button>
      }
    </div>

    <div class="controles">
      @if (vista() === 'vau') {
        <button
          type="button"
          class="btn"
          [attr.aria-expanded]="selectorAbierto()"
          aria-controls="selector-fecha"
          (click)="alternarSelector()"
        >
          <app-icono nombre="calendario" [tamanyo]="18" />
          {{ selectorAbierto() ? t('home.ocultarCalendario') : t('home.convertirFecha') }}
        </button>
      }

      <div class="contenedor-menu" #contenedorMenu>
        <button
          type="button"
          class="btn btn-primary"
          aria-haspopup="true"
          [attr.aria-expanded]="menuAbierto()"
          (click)="alternarMenu()"
        >
          <app-icono nombre="menu" [tamanyo]="18" />
          {{ menuAbierto() ? t('home.cerrarOpciones') : t('home.masOpciones') }}
        </button>

        @if (menuAbierto()) {
          <div class="menu" role="menu">
            @for (opcion of opciones(); track opcion.accion) {
              <button type="button" role="menuitem" (click)="ejecutar(opcion)">
                <app-icono [nombre]="opcion.icono" [tamanyo]="16" />
                {{ t(opcion.clave) }}
              </button>
            }
          </div>
        }
      </div>
    </div>
  </div>

  @if (selectorAbierto() && vista() === 'vau') {
    <div class="panel selector no-print" id="selector-fecha">
      <label class="field">
        <span>{{ t('home.elegirFecha') }}</span>
        <input
          #campoFecha
          class="input"
          type="date"
          [value]="fechaDelSelector()"
          (change)="seleccionarFecha($event)"
        />
      </label>
    </div>
  }

  <section class="card contenedor">
    @if (vista() === 'vau') {
      <app-date-vau [fecha]="fecha()" (fechaChange)="cambiarFecha($event)" />
    } @else {
      <app-descargas (back)="irAVau()" />
    }
  </section>
</div>
